<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptLineAI Events</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .device-id {
      margin-bottom: 16px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .events {
      max-height: 400px;
      overflow-y: auto;
    }
    .event {
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      background: #fafafa;
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .event-type {
      font-weight: 600;
      color: #1976d2;
    }
    .event-time {
      font-size: 12px;
      color: #666;
    }
    .event-details {
      font-size: 12px;
      color: #666;
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 32px;
    }
  </style>
</head>
<body>
  <h1>PromptLineAI Events</h1>
  <div class="device-id">
    <strong>Device ID:</strong> <span id="device-id">Loading...</span>
  </div>
  <div class="events" id="events">
    <div class="empty">Loading events...</div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
